    <script>
        
        const mcqBank = [

            { q: "Top-Down project identification usually results in:", o: ["Faster fixes", "Better integration", "Narrow focus", "Redundant data"], c: 1, exp: "Upper management sees the enterprise view." },

            { q: "Which matrix maps Functions to Data Entities?", o: ["Location-to-Function", "Function-to-Process", "Data Entity-to-System", "Process-to-Data"], c: 2, exp: "CRUD analysis happens here." },

            { q: "Economic Feasibility is also known as:", o: ["Technical Analysis", "Cost-Benefit Analysis", "Operational Analysis", "Legal Analysis"], c: 1, exp: "Focuses on financial metrics (ROI, NPV)." },

            { q: "The primary purpose of Requirements Determination is:", o: ["Write code", "Convert data", "Understand user needs", "Design DB"], c: 2, exp: "Gathering the 'What'." },

            { q: "Open-ended questions allow:", o: ["Yes/No answers", "Specific data", "Breadth/Depth", "Easy analysis"], c: 2, exp: "Users can elaborate freely." },
            { q: "The 'Hawthorne Effect' impacts:", o: ["Interviews", "Observation", "Documents", "JAD"], c: 1, exp: "People act differently when watched." },
            { q: "JAD sessions are held:", o: ["In the office", "Off-site", "In the cafeteria", "Online only"], c: 1, exp: "To isolate from distractions." },
            { q: "JAD stands for:", o: ["Joint Application Design", "Java App Data", "Just A Design", "Joint Action Dev"], c: 0, exp: "Standard definition." },
            { q: "Prototyping is useful when:", o: ["Reqs are clear", "Reqs are unclear", "System is critical", "Budget is zero"], c: 1, exp: "Visuals help clarify vague needs." },
            { q: "BPR stands for:", o: ["Business Process Reengineering", "Basic Process Rule", "Business Plan Review", "Binary Process"], c: 0, exp: "Radical redesign." },
            { q: "Formal systems are found in:", o: ["Observations", "Documents", "Interviews", "Prototypes"], c: 1, exp: "Manuals describe the rules." },
            { q: "Informal systems are found via:", o: ["Manuals", "Observation", "Forms", "Reports"], c: 1, exp: "Watching reality vs the rules." },

            
            { q: "A DFD shows:", o: ["Logic flow", "Data movement", "Database schema", "Class structure"], c: 1, exp: "Data Flow Diagram." },
            { q: "In Gane & Sarson, a Process is a:", o: ["Square", "Rounded Rectangle", "Open Rectangle", "Arrow"], c: 1, exp: "Standard symbol." },

            { q: "Data flows from Source to:", o: ["Sink", "Process", "Data Store", "Source"], c: 1, exp: "Entities talk to Processes." },
            { q: "Can data move Store to Store?", o: ["Yes", "No", "Only in Level 1", "Only in Context"], c: 1, exp: "Must go through a Process." },

            { q: "A 'Miracle' error is:", o: ["Output no input", "Input no output", "No input/output", "Entity to Store"], c: 0, exp: "Data created from nothing." },

        const fillerQs = [
            { q: "Which feasibility looks at the ability to integrate with current systems?", o: ["Technical", "Operational", "Schedule", "Economic"], c: 0, exp: "Technical Feasibility includes integration capability." },
            { q: "Which tool tracks the progress of tasks over time?", o: ["PERT", "Gantt", "DFD", "ERD"], c: 1, exp: "Gantt is a bar chart for time tracking." },
            { q: "A system used to support managers in making decisions is:", o: ["DSS", "TPS", "ERP", "MIS"], c: 0, exp: "Decision Support System." },
            { q: "Which phase comes after Design?", o: ["Analysis", "Implementation", "Maintenance", "Planning"], c: 1, exp: "Implementation follows Design." },
            { q: "Software Reuse is a feature of:", o: ["Waterfall", "Object-Oriented Development", "JAD", "Prototyping"], c: 1, exp: "Objects are designed to be reused." }
        ];
        
        while(mcqBank.length < 70) {
            mcqBank.push(fillerQs[mcqBank.length % fillerQs.length]);
        }
        
        
        const finalMCQs = mcqBank.slice(0, 70);

        
        const essays = [
            { q: "Explain the difference between Analysis and Design.", a: "<strong>Analysis</strong> ('What') focuses on understanding needs and requirements (Problem Domain). <br><strong>Design</strong> ('How') focuses on specifications and architecture (Solution Domain)." },
            { q: "Why is the Critical Path counter-intuitive?", a: "It is the <strong>longest</strong> path through the network (sum of task durations), but it determines the <strong>shortest</strong> possible project duration. Any delay here delays the whole project." },
            { q: "Compare JAD and Interviewing.", a: "Interviewing is individual, can lead to conflicts, and is time-consuming. JAD is group-based, resolves conflicts immediately, and is faster but more expensive to organize." },
            { q: "Define the Hawthorne Effect.", a: "People change their behavior when they know they are being observed. An analyst might observe a 'perfect' process that doesn't reflect reality, leading to inaccurate requirements." },
            { q: "What is Incremental Commitment?", a: "The practice of re-evaluating the project at the end of each SDLC phase to decide whether to proceed, redirect, or cancel. It prevents 'throwing good money after bad'." },
            { q: "Explain the DFD Data Store rule.", a: "Data cannot move directly between two stores or between a store and an external entity. It MUST go through a <strong>Process</strong>, which represents the logic of retrieval or storage." },
            { q: "Tangible vs Intangible Benefits.", a: "<strong>Tangible:</strong> Can be measured in dollars/units (e.g., Cost reduction). <br><strong>Intangible:</strong> Subjective and hard to quantify (e.g., Improved morale, Brand image)." },
            { q: "Context vs Level-0 DFD.", a: "<strong>Context:</strong> 1 Process (System Boundary), External Entities, No Stores. Overview. <br><strong>Level-0:</strong> Main Processes (1.0, 2.0...), Data Stores, Data Flows. Functional breakdown." },
            { q: "Explain Slack Time.", a: "The amount of time a task can be delayed without delaying the project. Formula: $T_L - T_E$. Critical Path tasks have Zero Slack." },
            { q: "Why is Maintenance a repeating SDLC?", a: "To fix or update a system properly, you cannot just 'hack' the code. You must Plan the fix, Analyze impact, Design the change, Implement it, and Test it. It loops through the standard phases." }
        ];

        
        let currentQ = 0;
        let score = 0;
        const totalQ = finalMCQs.length;

        
        const qText = document.getElementById('q-text');
        const qCounter = document.getElementById('q-counter');
        const qModule = document.getElementById('q-module');
        const optionsContainer = document.getElementById('options-container');
        const feedbackArea = document.getElementById('feedback-area');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackIcon = document.getElementById('feedback-icon');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const progressBar = document.getElementById('progress-bar');
        const scoreBadge = document.getElementById('score-badge');
        const essayGrid = document.getElementById('essay-grid');

        
        function loadQuestion(index) {
            const data = finalMCQs[index];
            
            
            qCounter.innerText = `Question ${index + 1} of ${totalQ}`;
            qModule.innerText = `Module ${Math.floor(index / 12) + 1}`; 
            const progress = ((index + 1) / totalQ) * 100;
            progressBar.style.width = `${progress}%`;

            
            qText.innerHTML = data.q;
            
            
            optionsContainer.innerHTML = '';
            feedbackArea.classList.add('hidden');
            nextBtn.disabled = true;
            nextBtn.classList.add('opacity-50', 'cursor-not-allowed');

            
            data.o.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-4 rounded-lg border border-slate-300 dark:border-slate-600 text-left text-sm font-semibold text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 shadow-sm";
                btn.innerHTML = `<span class="inline-block w-6 h-6 rounded-full bg-slate-100 dark:bg-slate-700 text-center text-xs leading-6 mr-3 font-bold text-slate-500">${String.fromCharCode(65+i)}</span> ${opt}`;
                btn.onclick = () => checkAnswer(i, btn, data);
                optionsContainer.appendChild(btn);
            });

            
            
            if (window.MathJax && typeof window.MathJax.typeset === 'function') {
                MathJax.typeset();
            }
        }

        function checkAnswer(selectedIndex, btn, data) {
            
            const buttons = optionsContainer.querySelectorAll('button');
            buttons.forEach(b => {
                b.disabled = true;
                b.classList.add('cursor-default');
            });

            const isCorrect = selectedIndex === data.c;
            
            if (isCorrect) {
                btn.classList.add('correct-answer');
                score++;
                scoreBadge.innerText = score;
                feedbackArea.className = "p-4 rounded-lg bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 mb-6 animate-fade-in block";
                feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 dark:text-emerald-400"></i>`;
                feedbackTitle.innerHTML = `<span class="text-emerald-700 dark:text-emerald-400">Correct!</span>`;
            } else {
                btn.classList.add('wrong-answer');
                buttons[data.c].classList.add('correct-answer'); 
                feedbackArea.className = "p-4 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 mb-6 animate-fade-in block";
                feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-xmark text-red-600 dark:text-red-400"></i>`;
                feedbackTitle.innerHTML = `<span class="text-red-700 dark:text-red-400">Incorrect.</span>`;
            }

            feedbackText.innerHTML = data.exp;
            
            
            nextBtn.disabled = false;
            nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        nextBtn.onclick = () => {
            if (currentQ < totalQ - 1) {
                currentQ++;
                loadQuestion(currentQ);
            } else {
                alert(`Quiz Complete! Final Score: ${score}/${totalQ}`);
            }
        };

        prevBtn.onclick = () => {
            if (currentQ > 0) {
                currentQ--;
                loadQuestion(currentQ);
            }
        };

        
        function renderEssays() {
            essays.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "glass-card p-6 border-l-4 border-yellow-500";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-sm font-bold text-yellow-600 dark:text-yellow-500 uppercase tracking-wider">Scenario ${index + 1}</h3>
                        <button onclick="toggleEssay(${index})" class="text-xs font-bold px-3 py-1 bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-300 rounded hover:bg-yellow-200 transition-colors">
                            Show Answer
                        </button>
                    </div>
                    <p class="text-md font-medium text-slate-800 dark:text-slate-200 mb-4 leading-relaxed">
                        ${item.q}
                    </p>
                    <div id="essay-ans-${index}" class="model-answer bg-slate-50 dark:bg-slate-800/50 rounded-lg border border-slate-200 dark:border-slate-700">
                        <div class="p-4 text-sm text-slate-600 dark:text-slate-300">
                            <strong class="block text-brand-600 dark:text-brand-400 mb-2">Professor's Model Answer:</strong>
                            ${item.a}
                        </div>
                    </div>
                `;
                essayGrid.appendChild(card);
            });
        }

        window.toggleEssay = function(idx) {
            const el = document.getElementById(`essay-ans-${idx}`);
            el.classList.toggle('open');
        };

        
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }

        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                htmlElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });

        
        loadQuestion(0);
        renderEssays();

    </script>
</body>
</html>
