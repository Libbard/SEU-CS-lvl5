    <script>
        
        const mcqBank = [
            
            { q: "In an Activity Diagram, a 'Diamond' symbol represents a:", o: ["Process", "Decision (XOR)", "Parallel Fork (AND)", "Terminator"], c: 1, exp: "The diamond is a decision node where only one path is chosen." },
            { q: "Which symbol in an Activity Diagram represents a 'Fork' or 'Join'?", o: ["Diamond", "Thick Horizontal Bar", "Circle", "Rounded Rectangle"], c: 1, exp: "The synchronization bar (AND) allows parallel flows." },
            { q: "In a Use Case Diagram, 'Include' means:", o: ["Optional behavior", "Mandatory behavior", "Inheritance", "Error handling"], c: 1, exp: "The included use case is always executed." },
            { q: "In a Use Case Diagram, 'Extend' means:", o: ["Mandatory behavior", "Optional behavior", "Copying code", "Deleting data"], c: 1, exp: "The extended use case runs only under certain conditions." },
            { q: "The 'Actor' in a Use Case Diagram represents:", o: ["Internal logic", "External user or system", "Database", "Algorithm"], c: 1, exp: "Anyone or anything interacting with the system." },
            { q: "An Activity Diagram is most similar to a:", o: ["Class Diagram", "Flowchart", "ERD", "State Diagram"], c: 1, exp: "It models the dynamic flow of control." },
            { q: "BPMN stands for:", o: ["Business Process Modeling Notation", "Basic Program Method Number", "Binary Process Model Network", "Business Plan Management Node"], c: 0, exp: "Standard for business process modeling." },
            { q: "In Sequence Diagrams, the vertical axis represents:", o: ["Objects", "Time", "Messages", "Actors"], c: 1, exp: "Time progresses downwards." },
            { q: "Which UML diagram models the static structure?", o: ["Activity", "Sequence", "Class", "State"], c: 2, exp: "Class diagrams show structure (attributes/methods)." },
            { q: "A 'Swimlane' in an Activity Diagram groups activities by:", o: ["Time", "Responsibility (Actor)", "Cost", "Difficulty"], c: 1, exp: "It shows who does what." },

            
            { q: "An Entity-Relationship Diagram (ERD) models:", o: ["Process flow", "Data at rest", "User interfaces", "Network topology"], c: 1, exp: "It models entities and their relationships." },
            { q: "A 'Primary Key' must be:", o: ["Optional", "Unique and Not Null", "Duplicated", "Text only"], c: 1, exp: "It uniquely identifies a row." },
            { q: "A 'Foreign Key' is used to:", o: ["Uniquely identify a row", "Link two tables", "Calculate data", "Store passwords"], c: 1, exp: "It references the Primary Key of another table." },
            { q: "In UML Class Diagrams, a 'Hollow Diamond' represents:", o: ["Composition", "Aggregation", "Inheritance", "Dependency"], c: 1, exp: "Aggregation (Weak 'Has-a' relationship)." },
            { q: "In UML Class Diagrams, a 'Solid Diamond' represents:", o: ["Composition", "Aggregation", "Inheritance", "Interface"], c: 0, exp: "Composition (Strong 'Part-of' relationship)." },
            { q: "A Many-to-Many (M:N) relationship requires a(n) ______ to implement.", o: ["Foreign Key", "Associative Entity", "Index", "Trigger"], c: 1, exp: "You break M:N into two 1:M relationships." },
            { q: "Which attribute can be calculated from other attributes?", o: ["Derived", "Multivalued", "Composite", "Simple"], c: 0, exp: "e.g., Age derived from Birthdate." },
            { q: "An attribute that breaks down into sub-parts is:", o: ["Derived", "Composite", "Simple", "Key"], c: 1, exp: "e.g., Address (City, Street, Zip)." },
            { q: "The degree of a relationship is:", o: ["Number of entities participating", "Number of attributes", "Complexity", "Speed"], c: 0, exp: "Unary, Binary, Ternary." },
            { q: "Cardinality constraint specifies:", o: ["Data type", "Number of instances related", "Security level", "File size"], c: 1, exp: "e.g., 1:1, 1:M." },

            
            { q: "Normalization is the process of:", o: ["Creating redundancy", "Removing redundancy", "Backup", "Encryption"], c: 1, exp: "Organizing data to minimize duplication." },
            { q: "1NF requires:", o: ["No partial dependencies", "Atomic values", "No transitive dependencies", "Indexes"], c: 1, exp: "No repeating groups or lists." },
            { q: "2NF requires:", o: ["1NF + No Partial Dependency", "1NF only", "3NF", "No keys"], c: 0, exp: "Attributes must depend on the WHOLE key." },
            { q: "3NF requires:", o: ["2NF + No Transitive Dependency", "2NF + No Partial Dependency", "1NF", "Indexes"], c: 0, exp: "Non-key attributes must not depend on other non-key attributes." },
            { q: "If a Primary Key is a single attribute, the table is automatically in:", o: ["1NF", "2NF", "3NF", "4NF"], c: 1, exp: "Partial dependency is impossible without a composite key." },
            { q: "Which file organization is best for sequential scanning?", o: ["Hashed", "Indexed", "Sequential", "Random"], c: 2, exp: "Records are stored in order." },
            { q: "Which file organization provides the fastest random access?", o: ["Sequential", "Hashed", "Linked List", "Stack"], c: 1, exp: "Calculates address directly from key." },
            { q: "Denormalization is done to:", o: ["Save space", "Improve read performance", "Improve write performance", "Reduce redundancy"], c: 1, exp: "Reduces joins for faster queries." },
            { q: "Referential Integrity ensures:", o: ["PKs are unique", "FKs match valid PKs", "Data is encrypted", "Users are logged in"], c: 1, exp: "Prevents broken links between tables." },
            { q: "An Index is like a:", o: ["Table of Contents", "Book Cover", "Page Number", "Title"], c: 0, exp: "It points to data locations." },

            
            { q: "A Form is used for:", o: ["Input", "Output", "Storage", "Processing"], c: 0, exp: "User $\\to$ System." },
            { q: "A Report is used for:", o: ["Input", "Output", "Validation", "Calculation"], c: 1, exp: "System $\\to$ User." },
            { q: "A Turnaround Document is:", o: ["Input only", "Output only", "Output that becomes Input", "Deleted data"], c: 2, exp: "e.g., A utility bill stub." },
            { q: "Which is a usability metric?", o: ["Learnability", "Code size", "Server speed", "Disk usage"], c: 0, exp: "How fast a user can learn the system." },
            { q: "Highlighting should be used:", o: ["Everywhere", "Sparingly", "Never", "Randomly"], c: 1, exp: "Overuse reduces impact." },
            { q: "To check if a form is usable, you should perform:", o: ["Unit Testing", "Usability Testing", "Stress Testing", "Code Review"], c: 1, exp: "Observe real users." },
            { q: "Consistency in interface design means:", o: ["Different fonts on every page", "Same shortcuts/terms everywhere", "Using all colors", "Changing layouts"], c: 1, exp: "Reduces learning curve." },
            { q: "The '3-Click Rule' suggests:", o: ["Users should click 3 times to login", "Info should be found in 3 clicks", "Mice must have 3 buttons", "Forms need 3 fields"], c: 1, exp: "Navigation efficiency." },
            { q: "Breadcrumbs help users:", o: ["Eat", "Know their location", "Delete files", "Logout"], c: 1, exp: "Navigation trail." },
            { q: "Input validation should happen:", o: ["Never", "After saving", "Before processing", "Only on paper"], c: 2, exp: "Prevent bad data entry." },

            
            { q: "In a File Server architecture, processing happens on the:", o: ["Server", "Client", "Network", "Database"], c: 1, exp: "The whole file is sent to the client." },
            { q: "In a Client/Server architecture, the query is processed on the:", o: ["Server", "Client", "Router", "Browser"], c: 0, exp: "Only the result is sent to the client." },
            { q: "SaaS stands for:", o: ["System as a Service", "Software as a Service", "Storage as a System", "Security as a Service"], c: 1, exp: "e.g., Google Docs." },
            { q: "IaaS stands for:", o: ["Infrastructure as a Service", "Internet as a Service", "Info as a System", "Input as a Source"], c: 0, exp: "e.g., AWS EC2." },
            { q: "Middleware is used to:", o: ["Connect disparate systems", "Delete data", "Create UIs", "Format text"], c: 0, exp: "The 'glue' between OS and Apps." },
            { q: "SOA stands for:", o: ["System Oriented Architecture", "Service Oriented Architecture", "Simple Object Access", "Secure Online App"], c: 1, exp: "Building systems from reusable services." },
            { q: "A 'Thin Client' relies heavily on the:", o: ["Client PC", "Server", "User", "Keyboard"], c: 1, exp: "Most processing is done server-side." },
            { q: "XML is used for:", o: ["Data styling", "Data exchange/structure", "Programming logic", "Database storage"], c: 1, exp: "Standard for data transport." },
            { q: "SOAP is a protocol for:", o: ["Cleaning disks", "Web Services", "Database Design", "UI Design"], c: 1, exp: "Simple Object Access Protocol." },
            { q: "Cloud Computing provides resources:", o: ["On-demand", "Permanently", "Offline", "Manually"], c: 0, exp: "Elastic scalability." },

            
            { q: "Which testing type checks individual modules?", o: ["Integration", "System", "Unit", "Acceptance"], c: 2, exp: "Smallest scope." },
            { q: "Which testing type checks interfaces between modules?", o: ["Unit", "Integration", "System", "Stress"], c: 1, exp: "Ensures parts work together." },
            { q: "Which testing type checks requirements compliance?", o: ["Unit", "Integration", "System", "Code"], c: 2, exp: "Whole system verification." },
            { q: "Direct Installation is:", o: ["Low risk", "High risk", "Slow", "Expensive"], c: 1, exp: "Cold turkey switch. No backup." },
            { q: "Parallel Installation is:", o: ["Low risk, High cost", "High risk, Low cost", "Fast", "Simple"], c: 0, exp: "Run both systems. Safe but double entry." },
            { q: "Pilot Installation involves:", o: ["Installing everywhere", "Installing in one location", "Installing module by module", "Installing nothing"], c: 1, exp: "Test in one branch first." },
            { q: "System Documentation is for:", o: ["End Users", "Programmers/Maintenance", "Managers", "Customers"], c: 1, exp: "Details internal design." },
            { q: "User Documentation is for:", o: ["Programmers", "End Users", "Database Admins", "Network Eng"], c: 1, exp: "Instructions on usage." },
            { q: "Alpha Testing is done by:", o: ["Users with real data", "Users with simulated data", "Programmers", "Robots"], c: 1, exp: "Controlled environment." },
            { q: "Beta Testing is done by:", o: ["Users with real data", "Programmers", "Managers", "Designers"], c: 0, exp: "Live environment." },

            
            { q: "Which phase is the most expensive in the SDLC?", o: ["Analysis", "Design", "Implementation", "Maintenance"], c: 3, exp: "60-80% of TCO." },
            { q: "Corrective Maintenance involves:", o: ["Adding features", "Fixing bugs", "Adapting to OS", "Refactoring"], c: 1, exp: "Repairing defects." },
            { q: "Adaptive Maintenance involves:", o: ["Fixing bugs", "Environment changes", "User enhancements", "Code cleanup"], c: 1, exp: "e.g., New Windows version." },
            { q: "Perfective Maintenance involves:", o: ["Fixing bugs", "Environment changes", "Enhancements", "Backups"], c: 2, exp: "Making it better/faster." },
            { q: "Preventive Maintenance involves:", o: ["Fixing bugs", "Future-proofing", "Adding features", "Updating docs"], c: 1, exp: "e.g., Refactoring to prevent future crash." },
            { q: "MTBF stands for:", o: ["Mean Time Between Failures", "Mean Time Before Fix", "Max Time Between Files", "Min Time By Friday"], c: 0, exp: "Reliability metric." },
            { q: "Configuration Management controls:", o: ["User access", "Code versions", "Database size", "Network speed"], c: 1, exp: "Prevents overwriting code." },
            { q: "The 'Lost Update' problem occurs when:", o: ["Two users update same data w/o lock", "Server crashes", "Network is slow", "Disk is full"], c: 0, exp: "Concurrency issue." },
            { q: "Baseline modules are:", o: ["Draft code", "Tested and frozen modules", "Deleted modules", "Future modules"], c: 1, exp: "Stable versions." },
            { q: "Maintenance often costs ______ of total budget.", o: ["10-20%", "30-40%", "60-80%", "90-100%"], c: 2, exp: "Significant long-term cost." }
        ];

        
        
        const finalMCQs = mcqBank.slice(0, 70);

        
        const essays = [
            { q: "Explain the difference between 2NF and 3NF.", a: "<strong>2NF:</strong> Removes Partial Dependencies. (Attributes must depend on the WHOLE primary key). Only applies to Composite Keys. <br><strong>3NF:</strong> Removes Transitive Dependencies. (Non-key attributes must not depend on other non-key attributes)." },
            { q: "Compare File Server vs. Client/Server Architectures.", a: "<strong>File Server:</strong> Client requests file, Server sends ENTIRE file. Processing on Client. High network traffic. <br><strong>Client/Server:</strong> Client requests data, Server processes query, sends only RESULT. Processing split. Low network traffic." },
            { q: "Explain the 'Parallel Installation' strategy tradeoffs.", a: "<strong>Pros:</strong> Lowest risk. If new system fails, old one is still running. <br><strong>Cons:</strong> Highest cost and effort. Users must enter data twice (Double Entry), leading to fatigue and errors." },
            { q: "What is an Associative Entity and why is it needed?", a: "It is a table used to resolve a Many-to-Many (M:N) relationship. Relational DBs cannot store M:N directly. The Associative Entity sits between them, holding the Primary Keys of both as Foreign Keys." },
            { q: "Define Unit, Integration, and System Testing.", a: "<strong>Unit:</strong> Testing individual functions/modules in isolation. <br><strong>Integration:</strong> Testing if modules communicate correctly. <br><strong>System:</strong> Testing the full application against requirements." },
            { q: "What is the difference between Aggregation and Composition in UML?", a: "<strong>Aggregation (Hollow Diamond):</strong> Weak 'Has-a'. Parts exist independently (e.g., Library/Book). <br><strong>Composition (Solid Diamond):</strong> Strong 'Part-of'. Parts die with the whole (e.g., House/Room)." },
            { q: "Why is Maintenance the most expensive phase?", a: "It lasts the longest (years vs months). It involves fixing bugs (Corrective), adapting to new OS/Hardware (Adaptive), and adding new features requested by users (Perfective)." },
            { q: "Explain the difference between XOR and AND gateways in Activity Diagrams.", a: "<strong>XOR (Diamond):</strong> Decision point. Only ONE path is taken. <br><strong>AND (Bar):</strong> Synchronization. ALL paths are taken in parallel." },
            { q: "What is Alpha vs. Beta Testing?", a: "<strong>Alpha:</strong> Controlled testing by users with simulated data (Developer environment). <br><strong>Beta:</strong> Uncontrolled testing by users with REAL data (Live environment)." },
            { q: "Explain the concept of 'Referential Integrity'.", a: "A database rule ensuring that a Foreign Key value must match a valid Primary Key value in the parent table. It prevents 'orphan' records." }
        ];

        
        let currentQ = 0;
        let score = 0;
        const totalQ = finalMCQs.length;

        
        const qText = document.getElementById('q-text');
        const qCounter = document.getElementById('q-counter');
        const qModule = document.getElementById('q-module');
        const optionsContainer = document.getElementById('options-container');
        const feedbackArea = document.getElementById('feedback-area');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackIcon = document.getElementById('feedback-icon');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const progressBar = document.getElementById('progress-bar');
        const scoreBadge = document.getElementById('score-badge');
        const essayGrid = document.getElementById('essay-grid');

        
        function loadQuestion(index) {
            const data = finalMCQs[index];
            
            
            qCounter.innerText = `Question ${index + 1} of ${totalQ}`;
            qModule.innerText = `Module ${Math.floor(index / 10) + 7}`; 
            if (index < 10) qModule.innerText = "Module 7"; 
            else if (index < 20) qModule.innerText = "Module 8";
            else if (index < 30) qModule.innerText = "Module 9";
            else if (index < 40) qModule.innerText = "Module 10";
            else if (index < 50) qModule.innerText = "Module 11";
            else if (index < 60) qModule.innerText = "Module 12";
            else qModule.innerText = "Module 13";

            const progress = ((index + 1) / totalQ) * 100;
            progressBar.style.width = `${progress}%`;

            
            qText.innerHTML = data.q;
            
            
            optionsContainer.innerHTML = '';
            feedbackArea.classList.add('hidden');
            nextBtn.disabled = true;
            nextBtn.classList.add('opacity-50', 'cursor-not-allowed');

            
            data.o.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-4 rounded-lg border border-slate-300 dark:border-slate-600 text-left text-sm font-semibold text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 shadow-sm";
                btn.innerHTML = `<span class="inline-block w-6 h-6 rounded-full bg-slate-100 dark:bg-slate-700 text-center text-xs leading-6 mr-3 font-bold text-slate-500">${String.fromCharCode(65+i)}</span> ${opt}`;
                btn.onclick = () => checkAnswer(i, btn, data);
                optionsContainer.appendChild(btn);
            });

            
            
            if (window.MathJax && typeof window.MathJax.typeset === 'function') {
                MathJax.typeset();
            }
        }

        function checkAnswer(selectedIndex, btn, data) {
            
            const buttons = optionsContainer.querySelectorAll('button');
            buttons.forEach(b => {
                b.disabled = true;
                b.classList.add('cursor-default');
            });

            const isCorrect = selectedIndex === data.c;
            
            if (isCorrect) {
                btn.classList.add('correct-answer');
                score++;
                scoreBadge.innerText = score;
                feedbackArea.className = "p-4 rounded-lg bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 mb-6 animate-fade-in block";
                feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 dark:text-emerald-400"></i>`;
                feedbackTitle.innerHTML = `<span class="text-emerald-700 dark:text-emerald-400">Correct!</span>`;
            } else {
                btn.classList.add('wrong-answer');
                buttons[data.c].classList.add('correct-answer');
                feedbackArea.className = "p-4 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 mb-6 animate-fade-in block";
                feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-xmark text-red-600 dark:text-red-400"></i>`;
                feedbackTitle.innerHTML = `<span class="text-red-700 dark:text-red-400">Incorrect.</span>`;
            }

            feedbackText.innerHTML = data.exp;
            
            
            nextBtn.disabled = false;
            nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        nextBtn.onclick = () => {
            if (currentQ < totalQ - 1) {
                currentQ++;
                loadQuestion(currentQ);
            } else {
                alert(`Gauntlet Complete! Score: ${score}/${totalQ}`);
            }
        };

        prevBtn.onclick = () => {
            if (currentQ > 0) {
                currentQ--;
                loadQuestion(currentQ);
            }
        };

        
        function renderEssays() {
            essays.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "glass-card p-6 border-l-4 border-yellow-500";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-sm font-bold text-yellow-600 dark:text-yellow-500 uppercase tracking-wider">Scenario ${index + 1}</h3>
                        <button onclick="toggleEssay(${index})" class="text-xs font-bold px-3 py-1 bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-300 rounded hover:bg-yellow-200 transition-colors">
                            Show Answer
                        </button>
                    </div>
                    <p class="text-md font-medium text-slate-800 dark:text-slate-200 mb-4 leading-relaxed">
                        ${item.q}
                    </p>
                    <div id="essay-ans-${index}" class="model-answer bg-slate-50 dark:bg-slate-800/50 rounded-lg border border-slate-200 dark:border-slate-700">
                        <div class="p-4 text-sm text-slate-600 dark:text-slate-300">
                            <strong class="block text-brand-600 dark:text-brand-400 mb-2">Professor's Model Answer:</strong>
                            ${item.a}
                        </div>
                    </div>
                `;
                essayGrid.appendChild(card);
            });
        }

        window.toggleEssay = function(idx) {
            const el = document.getElementById(`essay-ans-${idx}`);
            el.classList.toggle('open');
        };

        
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }

        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                htmlElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });

        
        loadQuestion(0);
        renderEssays();

    </script>
</body>
</html>
