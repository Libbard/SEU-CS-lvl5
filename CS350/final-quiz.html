    <script>
        
        const mcqBank = [
            
            { q: "Which SQL command is used to modify the structure of an existing table?", o: ["UPDATE", "ALTER", "MODIFY", "CHANGE"], c: 1, exp: "ALTER TABLE is used to add, delete, or modify columns/constraints." },

            { q: "The basic form of a SQL retrieval query is:", o: ["SELECT-WHERE-FROM", "SELECT-FROM-WHERE", "FROM-SELECT-WHERE", "WHERE-SELECT-FROM"], c: 1, exp: "SELECT cols FROM tables WHERE condition." },

            { q: "Which aggregate function counts the number of rows?", o: ["SUM", "TOTAL", "COUNT", "NUMBER"], c: 2, exp: "`COUNT(*)` counts rows." },

            { q: "Which Relational Algebra operation filters rows?", o: ["Project ($\pi$)", "Select ($\sigma$)", "Join ($\bowtie$)", "Union ($\cup$)"], c: 1, exp: "Selection ($\sigma$)." },
            { q: "Which Relational Algebra operation filters columns?", o: ["Project ($\pi$)", "Select ($\sigma$)", "Join ($\bowtie$)", "Product ($\times$)"], c: 0, exp: "Projection ($\pi$)." },
            { q: "The Cartesian Product ($\times$) of a table with 5 rows and one with 4 rows has:", o: ["9 rows", "20 rows", "1 row", "0 rows"], c: 1, exp: "$5 \times 4 = 20$." },

            { q: "Query Trees represent:", o: ["Relational Algebra expressions", "File directory", "User hierarchy", "Network topology"], c: 0, exp: "Internal representation for query optimization." },

            
            { q: "Normalization is used to:", o: ["Increase redundancy", "Minimize redundancy and anomalies", "Create backups", "Encrypt data"], c: 1, exp: "Primary goal is good design." },
            { q: "1NF disallows:", o: ["Null values", "Composite/Multivalued attributes", "Foreign keys", "Text data"], c: 1, exp: "Values must be atomic." },
            { q: "A Functional Dependency $X \to Y$ means:", o: ["Y determines X", "If X is known, Y is unique/determined", "X and Y are unrelated", "X is a key"], c: 1, exp: "X determines Y." },
            { q: "2NF requires 1NF and no ______ dependencies.", o: ["Transitive", "Partial", "Trivial", "Cyclic"], c: 1, exp: "Non-prime attributes must depend on the FULL primary key." },
            { q: "3NF requires 2NF and no ______ dependencies.", o: ["Transitive", "Partial", "Trivial", "Cyclic"], c: 0, exp: "Non-prime attribute depending on another non-prime attribute." },
            { q: "A Partial Dependency occurs when an attribute depends on:", o: ["The whole PK", "Part of a composite PK", "A non-key attribute", "Nothing"], c: 1, exp: "Violates 2NF." },
            { q: "A Transitive Dependency is:", o: ["A -> B -> C", "A -> B", "A -> A", "A -> B -> A"], c: 0, exp: "C depends on A via B." },
            { q: "Armstrong's Axioms are used for:", o: ["Query optimization", "Inference of Functional Dependencies", "Security", "Backup"], c: 1, exp: "Reflexivity, Augmentation, Transitivity." },
            { q: "A Prime Attribute is:", o: ["First attribute in table", "Part of a Candidate Key", "A foreign key", "An integer"], c: 1, exp: "Member of any key." },
            { q: "If a table has a single-attribute Primary Key, it is automatically in:", o: ["1NF", "2NF", "3NF", "4NF"], c: 1, exp: "No partial dependencies possible." },

            
            { q: "BCNF is stricter than 3NF because:", o: ["It allows transitive dependency", "It requires every determinant to be a Superkey", "It requires no keys", "It allows multivalued attributes"], c: 1, exp: "Removes the exception for prime attributes." },
            { q: "4NF deals with:", o: ["Functional Dependencies", "Multivalued Dependencies (MVD)", "Join Dependencies", "Inclusion Dependencies"], c: 1, exp: "Separating independent multivalued facts." },
            { q: "An MVD is denoted by:", o: ["X -> Y", "X ->> Y", "X => Y", "X ~> Y"], c: 1, exp: "Double arrow." },
            { q: "5NF deals with:", o: ["Join Dependencies", "Functional Dependencies", "MVDs", "Primary Keys"], c: 0, exp: "Project-Join Normal Form." },
            { q: "Lossless Join Property ensures:", o: ["No data is lost/spurious tuples created during decomposition", "Joins are fast", "No nulls", "Tables are small"], c: 0, exp: "Crucial for valid normalization." },
            { q: "Dependency Preservation means:", o: ["All FDs can be checked within individual tables", "No FDs allowed", "Backups are safe", "Keys are preserved"], c: 0, exp: "Constraints are enforceable without joining tables." },
            { q: "DKNF stands for:", o: ["Data Key Normal Form", "Domain-Key Normal Form", "Direct Key Normal Form", "Database Key Normal Form"], c: 1, exp: "The theoretical ultimate form." },

            { q: "Which security goal ensures data is not modified by unauthorized users?", o: ["Confidentiality", "Integrity", "Availability", "Privacy"], c: 1, exp: "Integrity." },
            { q: "Which security goal ensures data is visible only to authorized users?", o: ["Confidentiality", "Integrity", "Availability", "Utility"], c: 0, exp: "Confidentiality." },
            { q: "DAC stands for:", o: ["Direct Access Control", "Discretionary Access Control", "Database Access Control", "Data Admin Control"], c: 1, exp: "Owner decides access." },
            { q: "MAC stands for:", o: ["Mandatory Access Control", "Multiple Access Control", "Main Access Control", "Managed Access Control"], c: 0, exp: "System decides access (Clearance)." },

            { q: "Which command removes privileges?", o: ["REMOVE", "REVOKE", "DELETE", "DENY"], c: 1, exp: "REVOKE SELECT ON..." }
        ];

        
        const essays = [
            { q: "Explain the difference between `DELETE`, `DROP`, and `TRUNCATE`.", a: "<strong>DELETE:</strong> DML command. Removes rows based on WHERE clause. Can be rolled back. Slower. <br><strong>TRUNCATE:</strong> DDL command. Removes ALL rows. Resets identity. Cannot be rolled back (usually). Faster. <br><strong>DROP:</strong> DDL command. Removes the table structure and data entirely." },
            { q: "What is a View and why use it?", a: "A <strong>View</strong> is a virtual table defined by a query. <br><strong>Uses:</strong> 1) Simplifies complex queries for users. 2) Security (hide sensitive columns). 3) Logical Data Independence (rename columns/structure)." },
            { q: "Explain the difference between Inner Join and Outer Join.", a: "<strong>Inner Join:</strong> Returns only rows where there is a match in BOTH tables. <br><strong>Outer Join (Left/Right/Full):</strong> Returns all rows from one (or both) tables, filling in NULLs where no match is found." },
            { q: "What is a Correlated Nested Query?", a: "A subquery that uses values from the outer query. It executes once for <strong>every row</strong> processed by the outer query, which can be slow (performance impact). Example: Finding employees earning more than the average of <em>their own</em> department." },
            { q: "Define 1NF, 2NF, and 3NF simply.", a: "<strong>1NF:</strong> No lists/groups (Atomic values). <br><strong>2NF:</strong> 1NF + No Partial Dependency (Everything depends on the whole Key). <br><strong>3NF:</strong> 2NF + No Transitive Dependency (No non-key attributes determining other non-key attributes)." },
            { q: "What is BCNF?", a: "<strong>Boyce-Codd Normal Form:</strong> A stricter 3NF. It requires that for every functional dependency $X \\to Y$, $X$ must be a <strong>Superkey</strong>. It handles edge cases where a prime attribute depends on a non-prime attribute." },
            { q: "Explain the ACID properties (briefly relevant to design/security).", a: "<strong>Atomicity:</strong> All or nothing. <br><strong>Consistency:</strong> DB stays valid. <br><strong>Isolation:</strong> Transactions don't interfere. <br><strong>Durability:</strong> Saved data stays saved." },
            { q: "What is SQL Injection and how do you prevent it?", a: "An attack where malicious SQL is inserted into input fields to manipulate the database (e.g., `' OR '1'='1`). <br><strong>Prevention:</strong> Use <strong>Prepared Statements</strong> (Bind Variables) which treat input as data, not executable code." },
            { q: "Compare DAC and MAC security models.", a: "<strong>DAC (Discretionary):</strong> Users control access to their own data (GRANT/REVOKE). Flexible but prone to Trojan horses. <br><strong>MAC (Mandatory):</strong> System controls access based on clearance levels (Top Secret vs Public). Rigid but secure against leakage." },
            { q: "What is the difference between WHERE and HAVING?", a: "<strong>WHERE:</strong> Filters rows <em>before</em> grouping. Cannot use aggregates like SUM(). <br><strong>HAVING:</strong> Filters groups <em>after</em> grouping. Used with aggregates (e.g., `HAVING COUNT(*) > 5`)." }
        ];

        
        let currentQ = 0;
        let score = 0;
        const totalQ = mcqBank.length;

        
        const qText = document.getElementById('q-text');
        const qCounter = document.getElementById('q-counter');
        const qModule = document.getElementById('q-module');
        const optionsContainer = document.getElementById('options-container');
        const feedbackArea = document.getElementById('feedback-area');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackIcon = document.getElementById('feedback-icon');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const progressBar = document.getElementById('progress-bar');
        const scoreBadge = document.getElementById('score-badge');
        const essayGrid = document.getElementById('essay-grid');

        
        function loadQuestion(index) {
            const data = mcqBank[index];
            
            
            qCounter.innerText = `Question ${index + 1} of ${totalQ}`;
            
            
            let modName = "General";
            if(index < 10) modName = "Mod 7: DDL";
            else if(index < 20) modName = "Mod 8: DML";
            else if(index < 30) modName = "Mod 9: Adv SQL";
            else if(index < 40) modName = "Mod 10: Views";
            else if(index < 50) modName = "Mod 11: Norm I";
            else if(index < 60) modName = "Mod 12: Norm II";
            else modName = "Mod 13: Security";
            
            qModule.innerText = modName;

            const progress = ((index + 1) / totalQ) * 100;
            progressBar.style.width = `${progress}%`;

            
            qText.innerHTML = data.q;
            
            
            optionsContainer.innerHTML = '';
            feedbackArea.classList.add('hidden');
            nextBtn.disabled = true;
            nextBtn.classList.add('opacity-50', 'cursor-not-allowed');

            
            data.o.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-4 rounded-lg border border-slate-300 dark:border-slate-600 text-left text-sm font-semibold text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 shadow-sm";
                btn.innerHTML = `<span class="inline-block w-6 h-6 rounded-full bg-slate-100 dark:bg-slate-700 text-center text-xs leading-6 mr-3 font-bold text-slate-500">${String.fromCharCode(65+i)}</span> ${opt}`;
                btn.onclick = () => checkAnswer(i, btn, data);
                optionsContainer.appendChild(btn);
            });

            
            
            if (window.MathJax && typeof window.MathJax.typeset === 'function') {
                MathJax.typeset();
            }
        }

        function checkAnswer(selectedIndex, btn, data) {
            
            const buttons = optionsContainer.querySelectorAll('button');
            buttons.forEach(b => {
                b.disabled = true;
                b.classList.add('cursor-default');
            });

            const isCorrect = selectedIndex === data.c;
            
            if (isCorrect) {
                btn.classList.add('correct-answer');
                score++;
                scoreBadge.innerText = score;
                feedbackArea.className = "p-4 rounded-lg bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 mb-6 animate-fade-in block";
                feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 dark:text-emerald-400"></i>`;
                feedbackTitle.innerHTML = `<span class="text-emerald-700 dark:text-emerald-400">Correct!</span>`;
            } else {
                btn.classList.add('wrong-answer');
                buttons[data.c].classList.add('correct-answer');
                feedbackArea.className = "p-4 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 mb-6 animate-fade-in block";
                feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-xmark text-red-600 dark:text-red-400"></i>`;
                feedbackTitle.innerHTML = `<span class="text-red-700 dark:text-red-400">Incorrect.</span>`;
            }

            feedbackText.innerHTML = data.exp;
            
            
            nextBtn.disabled = false;
            nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        nextBtn.onclick = () => {
            if (currentQ < totalQ - 1) {
                currentQ++;
                loadQuestion(currentQ);
            } else {
                alert(`Gauntlet Complete! Score: ${score}/${totalQ}`);
            }
        };

        prevBtn.onclick = () => {
            if (currentQ > 0) {
                currentQ--;
                loadQuestion(currentQ);
            }
        };

        
        function renderEssays() {
            essays.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "glass-card p-6 border-l-4 border-fuchsia-500";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-sm font-bold text-fuchsia-600 dark:text-fuchsia-500 uppercase tracking-wider">Scenario ${index + 1}</h3>
                        <button onclick="toggleEssay(${index})" class="text-xs font-bold px-3 py-1 bg-fuchsia-100 dark:bg-fuchsia-900/30 text-fuchsia-700 dark:text-fuchsia-300 rounded hover:bg-fuchsia-200 transition-colors">
                            Show Answer
                        </button>
                    </div>
                    <p class="text-md font-medium text-slate-800 dark:text-slate-200 mb-4 leading-relaxed">
                        ${item.q}
                    </p>
                    <div id="essay-ans-${index}" class="model-answer bg-slate-50 dark:bg-slate-800/50 rounded-lg border border-slate-200 dark:border-slate-700">
                        <div class="p-4 text-sm text-slate-600 dark:text-slate-300">
                            <strong class="block text-brand-600 dark:text-brand-400 mb-2">Professor's Model Answer:</strong>
                            ${item.a}
                        </div>
                    </div>
                `;
                essayGrid.appendChild(card);
            });
        }

        window.toggleEssay = function(idx) {
            const el = document.getElementById(`essay-ans-${idx}`);
            el.classList.toggle('open');
        };

        
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }

        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                htmlElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });

        
        loadQuestion(0);
        renderEssays();

    </script>
</body>
</html>
